name: Buddy 加油站每日签到 + 派猫

# 免费 schedule 定时任务，云端 runner；无需任何常开设备。
# 单次运行内完成：refresh token 换取 access token -> 签到 -> 领旅行积分/派猫 -> 飞书推送。
on:
  schedule:
    # UTC 22:00 = 北京时间次日 06:00，每天一次
    - cron: '0 22 * * *'
  workflow_dispatch:  # 支持手动触发验证

permissions:
  contents: read

concurrency:
  group: buddy-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 运行签到与派猫（单次运行内完成）
        env:
          WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WB_LOCATION_ID: ${{ vars.WB_LOCATION_ID }}
        run: |
          # 不硬编码任何 Python 版本号/解释器路径，运行时动态获取
          PY="$(command -v python3 || command -v python)"
          echo "Using interpreter: $PY"
          "$PY" scripts/daily.py

      - name: 上传脱敏证据（可选）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-daily-evidence
          path: evidence/latest.json
          if-no-files-found: ignore
          retention-days: 7
